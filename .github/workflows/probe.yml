name: probe

# Запускается ТОЛЬКО вручную кнопкой "Run workflow". Расписания нет, ничего само не работает.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка источников
        env:
          PYTHONUTF8: "1"
          GIFTASSET_TOKEN: ${{ secrets.GIFTASSET_TOKEN }}
        run: python probe.py

      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: probe_report.txt
          if-no-files-found: ignore
